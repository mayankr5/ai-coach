spring:
  application:
    name: ai-coach
  config:
    # Local secrets (API keys) live in a git-ignored backend/.env file; real environment variables still win
    # Tests point AI_COACH_ENV_FILE elsewhere so they never depend on a developer's local settings
    import: optional:file:${AI_COACH_ENV_FILE:.env}[.properties]
  autoconfigure:
    # Auth is JWT-based; skip Spring's default in-memory user and generated password
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aicoach}
    username: ${DB_USERNAME:aicoach}
    password: ${DB_PASSWORD:aicoach}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    model:
      # Chat models are built by com.aicoach.ai.ChatModelFactory from app.ai.chain, not auto-configured
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  planning:
    # Tasks are only scheduled this many days ahead; daily re-planning extends the window
    task-window-days: 14
    # Hourly would also work; daily at 03:00 UTC covers every timezone's "yesterday" by then
    missed-day-cron: ${MISSED_DAY_CRON:0 0 3 * * *}
  ai:
    # Models tried in order until one gives a usable answer; each entry is provider/model.
    # Providers: google-genai, ollama, anthropic, openai. Entries without an API key are skipped.
    chain: ${AI_CHAIN:google-genai/gemini-3.6-flash,ollama/qwen2.5:7b}
    # Longest wait for one answer, and for all attempts together (what the user waits at most)
    plan-timeout: 60s
    plan-budget: 90s
    message-timeout: 20s
    message-budget: 30s
    temperature: 0.3
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    gemini-api-key: ${GEMINI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # Responses are JSON; the web app's generated types expect it
  default-produces-media-type: application/json
